name: Gitea Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create Keystore
        run: |
          printf "%s" "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-key.jks

      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Jafr-${VERSION_NAME}.apk

      - name: Create Gitea Release & Upload APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK_NAME="Jafr-${VERSION_NAME}.apk"
          APK_PATH="app/build/outputs/apk/release/${APK_NAME}"

          # 1) ایجاد Release در گیت‌تی
          RELEASE_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${VERSION_NAME}\",\"name\":\"${VERSION_NAME}\",\"body\":\"نسخه جدید برنامه جفر منتشر شد\",\"draft\":false,\"prerelease\":false}" \
            "${SERVER_URL}/api/v1/repos/${REPO}/releases")

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | grep -oP '"id":\s*\K[0-9]+' | head -1)

          if [ -z "$RELEASE_ID" ]; then
            # اگر از قبل ریلیز وجود داشت، ID آن را می‌گیریم
            RELEASE_ID=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
              "${SERVER_URL}/api/v1/repos/${REPO}/releases/tags/${VERSION_NAME}" | grep -oP '"id":\s*\K[0-9]+' | head -1)
          fi

          echo "Release ID: ${RELEASE_ID}"

          # 2) آپلود فایل APK در Release
          curl -s -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: multipart/form-data" \
            -F "attachment=@${APK_PATH}" \
            "${SERVER_URL}/api/v1/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${APK_NAME}"

      - name: Update update.json for Gitea
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "VERSION_CODE=$VERSION_CODE, VERSION_NAME=$VERSION_NAME"

          python3 - "$VERSION_CODE" "$VERSION_NAME" "$SERVER_URL" "$REPO" <<'PYEOF'
          import json, sys
          vc, vn, server_url, repo = int(sys.argv[1]), sys.argv[2], sys.argv[3], sys.argv[4]
          data = {
              "versionCode": vc,
              "versionName": vn,
              "url": f"{server_url}/{repo}/releases/download/{vn}/Jafr-{vn}.apk",
              "releaseNotes": "به‌روزرسانی خودکار برنامه جفر",
              "isForceUpdate": False,
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PYEOF
          cat update.json

      - name: Commit update.json to master
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config --global user.name "Gitea Actions"
          git config --global user.email "actions@git.mizbanplatform.ir"
          git checkout master
          git add update.json
          git commit -m "release ${VERSION_NAME}: update update.json" || echo "nothing to commit"
          git push origin HEAD:master
